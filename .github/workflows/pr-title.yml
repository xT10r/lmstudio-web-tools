name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  title:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Validate event metadata only. Never check out or execute PR code here.
      - name: Require Conventional Commits with a scope
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          pattern = r'(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)\([a-z0-9]+(?:-[a-z0-9]+)*\)!?: \S[^\r\n]*'
          if not re.fullmatch(pattern, os.environ['PR_TITLE']):
              print('::error::Use type(scope): description, for example fix(reader): handle empty pages')
              sys.exit(1)
          print('PR title follows the commit convention.')
          PY
