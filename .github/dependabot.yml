version: 2

updates:
  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    ignore:
      # Match the runtime in .node-version; revisit when its major changes.
      - dependency-name: '@types/node'
        versions: ['>=23.0.0']
      # LM Studio SDK currently consumes Zod 3 schemas. Migrate SDK and schemas together.
      - dependency-name: zod
        versions: ['>=4.0.0']
      # jsdom 30 requires a newer Node.js runtime than the supported LM Studio baseline.
      - dependency-name: jsdom
        versions: ['>=30.0.0']
      # Review DOM types together with jsdom and the supported runtime.
      - dependency-name: '@types/jsdom'
        versions: ['>=29.0.0']
    groups:
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: ci
      include: scope
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
